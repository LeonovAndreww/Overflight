org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# IntelliJ IDEA is not yet fully compatible with the configuration cache, see
# https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Mod
version=0.2.0
group=dev.overflight

# Fabric, 26.2 branch. Check https://fabricmc.net/develop before bumping.
# Note: there are no Yarn mappings for 26.x -- official Mojang mappings are used
# and Loom supplies them by default, so no mappings dependency is declared.
minecraft_version=26.2
loader_version=0.19.5
loom_version=1.17-SNAPSHOT
fabric_api_version=0.159.0+26.2

# 26.1.x, the same generation of the render pipeline.
minecraft_version_261=26.1.2
fabric_api_version_261=0.155.3+26.1.2
cloth_config_version_261=26.1.154
mod_menu_version_261=18.0.0

# 1.21.6-1.21.11: same render pipeline generation, older class names.
minecraft_version_12111=1.21.11
loader_version_12111=0.17.2
fabric_api_version_12111=0.141.6+1.21.11
cloth_config_version_12111=21.11.153
mod_menu_version_12111=17.0.0

# Optional, for the settings screen.
cloth_config_version=26.2.155
mod_menu_version=20.0.1
