name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Two of them: 26.x requires Java 25, and 1.21.11 requires 21. Gradle picks
      # the right one per backend from the toolchains it is pointed at below.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: >-
          ./gradlew build --no-daemon
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64

      # The textures are generated from source, so the generators have to keep
      # running. Byte identity is deliberately not asserted: PNG encoding can
      # differ between JDK builds, and a false failure here would teach everyone
      # to ignore the job.
      - name: Run the asset generators
        run: |
          java tools/GenerateTrailTexture.java
          java tools/GenerateAircraftTexture.java
          java tools/GenerateIcon.java
          git diff --stat -- common/resources/assets

      - uses: actions/upload-artifact@v4
        with:
          name: overflight
          path: backends/*/build/libs/*.jar
