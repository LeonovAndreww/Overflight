name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      time:
        description: 'World time (ticks) for the forge-1-7-10-client shots'
        default: '6000'
      angelica:
        description: 'forge-1-7-10-client: also load Angelica (shader mod) and GTNHLib'
        default: 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Three of them: 26.x requires Java 25, 1.21.x requires 21 and 1.20.1/1.19.4/1.18.2 require 17. Gradle picks
      # the right one per backend from the toolchains it is pointed at below.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: >-
          ./gradlew build --no-daemon
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64

      # The textures are generated from source, so the generators have to keep
      # running. Byte identity is deliberately not asserted: PNG encoding can
      # differ between JDK builds, and a false failure here would teach everyone
      # to ignore the job.
      - name: Run the asset generators
        run: |
          java tools/GenerateTrailTexture.java
          java tools/GenerateAircraftTexture.java
          java tools/GenerateIcon.java
          git diff --stat -- common/resources/assets

      - uses: actions/upload-artifact@v4
        with:
          name: overflight
          path: backends/*/build/libs/*.jar

  # NeoForge is opt-in locally (moddev decompiles Minecraft, which is too heavy for the dev
  # server), so it is compiled here, on a runner with enough memory.
  neoforge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build NeoForge backend
        run: >-
          ./gradlew :backends:neoforge-1.21.1:build --no-daemon -PwithNeoForge
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64
      - uses: actions/upload-artifact@v4
        with:
          name: overflight-neoforge
          path: backends/neoforge-1.21.1/build/libs/*.jar

  # Forge 1.20.1 needs ForgeGradle 6 and MixinGradle, which are opt-in (-PwithForge) so that
  # they cannot break the Fabric builds.
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Build Forge backend
        run: >-
          gradle :backends:forge-1.20.1:build --no-daemon -PwithForge
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64
      - uses: actions/upload-artifact@v4
        with:
          name: overflight-forge
          path: backends/forge-1.20.1/build/libs/*.jar

  # Starts the Forge client on a software GL renderer, creates a world, takes screenshots of
  # the sky and uploads them with the log. Manual only: it downloads Minecraft and takes minutes.
  forge-client:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Install Mesa and Xvfb
        run: sudo apt-get update || true; sudo apt-get install -y xvfb x11-xserver-utils libgl1-mesa-dri mesa-utils libopenal1
      - name: Prepare run directory
        run: |
          mkdir -p backends/forge-1.20.1/run
          echo 12000 > backends/forge-1.20.1/run/overflight-autoshot
          echo "onboardAccessibility:false" > backends/forge-1.20.1/run/options.txt
      - name: Run client
        run: >-
          LIBGL_ALWAYS_SOFTWARE=1 timeout 1500
          xvfb-run -a -s "-screen 0 1280x720x24"
          gradle :backends:forge-1.20.1:runClient --no-daemon -PwithForge
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64
          | tee client.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-client
          path: |
            client.log
            backends/forge-1.20.1/run/screenshots/
            backends/forge-1.20.1/run/logs/latest.log

  # Loads the Fabric 1.20.1 jar on Quilt Loader (portablemc installs Quilt and Minecraft), with Quilted Fabric API,
  # and waits at the title screen. Checks the log for the mod's init line and for mixin/entrypoint errors. Manual only.
  quilt-client:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the jar
        run: >-
          ./gradlew :backends:fabric-1.20.1:build --no-daemon -PkeepDevShot
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64
      - name: Install Mesa, Xvfb and portablemc
        run: |
          sudo apt-get update || true
          sudo apt-get install -y xvfb x11-xserver-utils libgl1-mesa-dri mesa-utils libopenal1
          pip install portablemc
      - name: Prepare mods
        run: |
          mkdir -p ~/.minecraft/mods
          cp backends/fabric-1.20.1/build/libs/overflight-fabric-1.20.1-*.jar ~/.minecraft/mods/
          curl -fsSL -o ~/.minecraft/mods/qfapi.jar "https://cdn.modrinth.com/data/qvIfYCYJ/versions/s8dfz9Xa/qfapi-7.7.0_qsl-6.3.0_fapi-0.92.2_mc-1.20.1.jar"
          echo "onboardAccessibility:false" > ~/.minecraft/options.txt
          echo 12000 > ~/.minecraft/overflight-autoshot
          touch ~/.minecraft/overflight-autoshot-newworld
          ls -l ~/.minecraft/mods
      - name: Run client on Quilt
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 timeout 900 xvfb-run -a -s "-screen 0 1280x720x24" portablemc start quilt:1.20.1:0.30.2 2>&1 | tee client.log || true
      - name: Check the log
        run: |
          cp ~/.minecraft/logs/latest.log latest.log || true
          mkdir -p shots; cp ~/.minecraft/screenshots/* shots/ || true
          grep -n "Overflight is watching the sky" latest.log client.log
          grep -n -E "Autoshot|Sky hook seen|Manual flights" latest.log || true
          grep -q "Sky hook seen: true" latest.log
          if grep -n -i -E "MixinApplyError|MixinTransformerError|InvalidMixin|Mixin apply for mod overflight failed|Failed to load entrypoint|EntrypointException|Could not execute entrypoint" latest.log; then exit 1; fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quilt-client
          path: |
            client.log
            latest.log
            shots/

  # Fabric 26.2 with Sodium and Voxy on a software GL renderer (llvmpipe, GL 4.5). Voxy may want GL 4.6; the job
  # reports what happens either way. Manual only.
  voxy-client:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the jar
        run: >-
          ./gradlew :backends:fabric-26.2:build --no-daemon -PkeepDevShot
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64
      - name: Install Mesa, Xvfb and portablemc
        run: |
          sudo apt-get update || true
          sudo apt-get install -y xvfb x11-xserver-utils libgl1-mesa-dri mesa-utils libopenal1
          pip install portablemc
          xvfb-run -a glxinfo | grep -E "OpenGL (core profile )?version" || true
      - name: Prepare mods
        run: |
          mkdir -p ~/.minecraft/mods
          cp backends/fabric-26.2/build/libs/overflight-fabric-26.2-*.jar ~/.minecraft/mods/
          curl -fsSL -o ~/.minecraft/mods/fabric-api.jar "https://cdn.modrinth.com/data/P7dR8mSH/versions/ewUK83HI/fabric-api-0.161.0%2B26.2.jar"
          curl -fsSL -o ~/.minecraft/mods/sodium.jar "https://cdn.modrinth.com/data/AANobbMI/versions/xJZxADzI/sodium-fabric-0.9.2%2Bmc26.2.jar"
          curl -fsSL -o ~/.minecraft/mods/voxy.jar "https://cdn.modrinth.com/data/fxxUqruK/versions/LzyXnE51/voxy-0.2.19-beta.jar"
          echo "onboardAccessibility:false" > ~/.minecraft/options.txt
          echo 12000 > ~/.minecraft/overflight-autoshot
          ls -l ~/.minecraft/mods
      - name: Create a world with a vanilla server
        run: |
          mkdir -p srv && cd srv
          python3 - <<'PY'
          import json, urllib.request
          get = lambda u: json.load(urllib.request.urlopen(u))
          m = get("https://piston-meta.mojang.com/mc/game/version_manifest_v2.json")
          v = next(x for x in m["versions"] if x["id"] == "26.2")
          url = get(v["url"])["downloads"]["server"]["url"]
          urllib.request.urlretrieve(url, "server.jar")
          PY
          echo "eula=true" > eula.txt
          printf 'level-seed=1\nonline-mode=false\n' > server.properties
          (sleep 90; echo stop) | timeout 240 "$JAVA_HOME_25_X64/bin/java" -Xmx1g -jar server.jar nogui || true
          ls world
          mkdir -p ~/.minecraft/saves
          cp -r world "$HOME/.minecraft/saves/New World"
      - name: Run client with Voxy
        run: |
          MESA_GL_VERSION_OVERRIDE=4.6 MESA_GLSL_VERSION_OVERRIDE=460 LIBGL_ALWAYS_SOFTWARE=1 timeout 900 xvfb-run -a -s "-screen 0 1280x720x24" portablemc start --join-world "New World" fabric:26.2 2>&1 | tee client.log || true
      - name: Check the log
        if: always()
        run: |
          cp ~/.minecraft/logs/latest.log latest.log || true
          mkdir -p shots; cp ~/.minecraft/screenshots/* shots/ || true
          grep -n -i -E "voxy" latest.log | head -40 || true
          grep -n -E "Overflight is watching the sky|Autoshot|Sky hook seen|Manual flights" latest.log || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voxy-client
          path: |
            client.log
            latest.log
            shots/

  # Same for NeoForge 1.21.1. Starts the NeoForge client on a software GL renderer, creates a world, takes screenshots of
  # the sky and uploads them with the log. Manual only: it downloads Minecraft and takes minutes.
  neoforge-client:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Mesa and Xvfb
        run: sudo apt-get update || true; sudo apt-get install -y xvfb x11-xserver-utils libgl1-mesa-dri mesa-utils libopenal1
      - name: Prepare run directory
        run: |
          mkdir -p backends/neoforge-1.21.1/run
          echo 12000 > backends/neoforge-1.21.1/run/overflight-autoshot
          echo "onboardAccessibility:false" > backends/neoforge-1.21.1/run/options.txt
      - name: Run client
        run: >-
          LIBGL_ALWAYS_SOFTWARE=1 timeout 1500
          xvfb-run -a -s "-screen 0 1280x720x24"
          ./gradlew :backends:neoforge-1.21.1:runClient --no-daemon -PwithNeoForge
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64
          | tee client.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neoforge-client
          path: |
            client.log
            backends/neoforge-1.21.1/run/screenshots/
            backends/neoforge-1.21.1/run/logs/latest.log

  # Dedicated server with the mod: it has to start without client classes, register /airspace
  # and run a manual flight. Manual only: it downloads Minecraft.
  forge-server:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Prepare server directory
        run: |
          mkdir -p backends/forge-1.20.1/run-server
          echo "eula=true" > backends/forge-1.20.1/run-server/eula.txt
          printf 'enable-rcon=true\nrcon.port=25575\nrcon.password=ci\nonline-mode=false\n' > backends/forge-1.20.1/run-server/server.properties
      - name: Run server
        run: |
          timeout 900 gradle :backends:forge-1.20.1:runServer --no-daemon -PwithForge \
            -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64 > server.log 2>&1 &
          for i in $(seq 1 120); do grep -q "Done (" server.log && break; sleep 5; done
          grep -q "Done (" server.log
          python3 tools/rcon.py 25575 ci "airspace spawn airliner_narrowbody 350 90" "airspace clear" "stop" | tee rcon.log
          wait || true
          grep -q "Done (" server.log
          ! grep -E "NoClassDefFoundError|ClassNotFoundException|Mixin apply failed" server.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-server
          path: |
            server.log
            backends/forge-1.20.1/run-server/logs/latest.log

  # Dedicated server with the mod: it has to start without client classes, register /airspace
  # and run a manual flight. Manual only: it downloads Minecraft.
  neoforge-server:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare server directory
        run: |
          mkdir -p backends/neoforge-1.21.1/run-server
          echo "eula=true" > backends/neoforge-1.21.1/run-server/eula.txt
          printf 'enable-rcon=true\nrcon.port=25575\nrcon.password=ci\nonline-mode=false\n' > backends/neoforge-1.21.1/run-server/server.properties
      - name: Run server
        run: |
          timeout 900 ./gradlew :backends:neoforge-1.21.1:runServer --no-daemon -PwithNeoForge \
            -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64 > server.log 2>&1 &
          for i in $(seq 1 120); do grep -q "Done (" server.log && break; sleep 5; done
          grep -q "Done (" server.log
          python3 tools/rcon.py 25575 ci "airspace spawn airliner_narrowbody 350 90" "airspace clear" "stop" | tee rcon.log
          wait || true
          grep -q "Done (" server.log
          ! grep -E "NoClassDefFoundError|ClassNotFoundException|Mixin apply failed" server.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neoforge-server
          path: |
            server.log
            backends/neoforge-1.21.1/run-server/logs/latest.log

  # Forge 1.7.10 is a separate Gradle project (RetroFuturaGradle, GTNH build convention) that pulls
  # overflight-core in as sources. Too heavy and too slow to download for the dev server.
  forge-1-7-10:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
            21
            25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          build-root-directory: backends/forge-1.7.10
      - name: Build
        working-directory: backends/forge-1.7.10
        run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: overflight-forge-1.7.10
          path: backends/forge-1.7.10/build/libs/*.jar

  # Dedicated 1.7.10 server with the mod: no client classes may be touched, /airspace has to answer.
  # Manual only: it downloads Minecraft.
  forge-1-7-10-server:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
            21
            25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          build-root-directory: backends/forge-1.7.10
      - name: Prepare server directory
        run: |
          mkdir -p backends/forge-1.7.10/run/server
          echo "eula=true" > backends/forge-1.7.10/run/server/eula.txt
          printf 'enable-rcon=true\nrcon.port=25575\nrcon.password=ci\nonline-mode=false\n' > backends/forge-1.7.10/run/server/server.properties
      # RCON of the 1.7.10 server throws a NullPointerException on the first packet, so the commands go
      # through the console (stdin) instead; the server answers in its log.
      - name: Run server
        working-directory: backends/forge-1.7.10
        run: |
          mkfifo ../../console
          exec 3<>../../console
          timeout 1500 ./gradlew runServer --no-daemon < ../../console > ../../server.log 2>&1 &
          for i in $(seq 1 240); do grep -q "Done (" ../../server.log && break; sleep 5; done
          grep -q "Done (" ../../server.log
          for c in "airspace spawn airliner_narrowbody 350 90" "airspace convoy 3 airliner_narrowbody vee" "airspace clear" "airspace spawn nonsense"; do
            echo "$c" >&3
            sleep 3
          done
          echo "stop" >&3
          wait || true
          grep -q "Put a airliner_narrowbody over the sky for everyone" ../../server.log
          grep -q "Put a vee of 3 airliner_narrowbody over the sky for everyone" ../../server.log
          grep -q "Cleared hand-placed aircraft for everyone" ../../server.log
          grep -q "No such aircraft type: nonsense" ../../server.log
          ! grep -E "NoClassDefFoundError|ClassNotFoundException|Mixin apply failed" ../../server.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-1-7-10-server
          path: |
            server.log
            backends/forge-1.7.10/run/server/logs/

  # Starts the 1.7.10 client on a software GL renderer, opens a world, takes screenshots of the sky
  # and uploads them with the log. Manual only.
  forge-1-7-10-client:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
            21
            25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          build-root-directory: backends/forge-1.7.10
      - name: Install Mesa and Xvfb
        run: sudo apt-get update || true; sudo apt-get install -y xvfb x11-xserver-utils libgl1-mesa-dri mesa-utils libopenal1
      - name: Prepare run directory
        run: |
          mkdir -p backends/forge-1.7.10/run/client
          echo "${{ github.event.inputs.time || '6000' }}" > backends/forge-1.7.10/run/client/overflight-autoshot
      # Development (deobfuscated) jars from Modrinth, so the dev environment can load them.
      - name: Add Angelica
        if: github.event.inputs.angelica == 'true'
        run: |
          mkdir -p backends/forge-1.7.10/run/client/mods
          cd backends/forge-1.7.10/run/client/mods
          curl -fsSLO https://cdn.modrinth.com/data/XN5jnYB4/versions/UWYXHhOD/angelica-2.2.47-dev.jar
          curl -fsSLO https://cdn.modrinth.com/data/vTvnv7qp/versions/5idf63vS/gtnhlib-0.12.11-dev.jar
          ls -l
      - name: Run client
        working-directory: backends/forge-1.7.10
        shell: bash
        run: |
          set -o pipefail
          LIBGL_ALWAYS_SOFTWARE=1 timeout 1500 xvfb-run -a -s "-screen 0 1280x720x24 +extension RANDR" \
            ./gradlew runClient --no-daemon | tee ../../client.log
          grep -q "Autoshot: done" ../../client.log
          grep -q "Sky hook seen: true" ../../client.log
          grep -q "Manual flights: 4" ../../client.log
          grep -q "Command spawn handled: 1" ../../client.log
          grep -q "Command list handled: 1" ../../client.log
          grep -q "Command probe handled: 1" ../../client.log
          grep -q "Command set handled: 1, opacity 0.7" ../../client.log
          grep -q "Command preset handled: 1, look fancy" ../../client.log
          grep -q "Command get handled: 1" ../../client.log
          grep -q "Config screen result: maxAircraft=37 message=$" ../../client.log
          grep -q "Server command handled: 1" ../../client.log
          grep -q "Airspace request received: 1 flight" ../../client.log
          ! grep -q "sky rendering failed" ../../client.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-1-7-10-client
          path: |
            client.log
            backends/forge-1.7.10/run/client/screenshots/
            backends/forge-1.7.10/run/client/logs/
