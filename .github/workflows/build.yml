name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Three of them: 26.x requires Java 25, 1.21.x requires 21 and 1.20.1/1.19.4/1.18.2 require 17. Gradle picks
      # the right one per backend from the toolchains it is pointed at below.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: >-
          ./gradlew build --no-daemon
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64

      # The textures are generated from source, so the generators have to keep
      # running. Byte identity is deliberately not asserted: PNG encoding can
      # differ between JDK builds, and a false failure here would teach everyone
      # to ignore the job.
      - name: Run the asset generators
        run: |
          java tools/GenerateTrailTexture.java
          java tools/GenerateAircraftTexture.java
          java tools/GenerateIcon.java
          git diff --stat -- common/resources/assets

      - uses: actions/upload-artifact@v4
        with:
          name: overflight
          path: backends/*/build/libs/*.jar

  # NeoForge is opt-in locally (moddev decompiles Minecraft, which is too heavy for the dev
  # server), so it is compiled here, on a runner with enough memory.
  neoforge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build NeoForge backend
        run: >-
          ./gradlew :backends:neoforge-1.21.1:build --no-daemon -PwithNeoForge
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64
      - uses: actions/upload-artifact@v4
        with:
          name: overflight-neoforge
          path: backends/neoforge-1.21.1/build/libs/*.jar

  # Forge 1.20.1 needs ForgeGradle 6 and MixinGradle, which are opt-in (-PwithForge) so that
  # they cannot break the Fabric builds.
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Build Forge backend
        run: >-
          gradle :backends:forge-1.20.1:build --no-daemon -PwithForge
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64
      - uses: actions/upload-artifact@v4
        with:
          name: overflight-forge
          path: backends/forge-1.20.1/build/libs/*.jar

  # Starts the Forge client on a software GL renderer, creates a world, takes screenshots of
  # the sky and uploads them with the log. Manual only: it downloads Minecraft and takes minutes.
  forge-client:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Install Mesa and Xvfb
        run: sudo apt-get update || true; sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils libopenal1
      - name: Prepare run directory
        run: |
          mkdir -p backends/forge-1.20.1/run
          echo 12000 > backends/forge-1.20.1/run/overflight-autoshot
          echo "onboardAccessibility:false" > backends/forge-1.20.1/run/options.txt
      - name: Run client
        run: >-
          LIBGL_ALWAYS_SOFTWARE=1 timeout 1500
          xvfb-run -a -s "-screen 0 1280x720x24"
          gradle :backends:forge-1.20.1:runClient --no-daemon -PwithForge
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64
          | tee client.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-client
          path: |
            client.log
            backends/forge-1.20.1/run/screenshots/
            backends/forge-1.20.1/run/logs/latest.log

  # Same for NeoForge 1.21.1. Starts the NeoForge client on a software GL renderer, creates a world, takes screenshots of
  # the sky and uploads them with the log. Manual only: it downloads Minecraft and takes minutes.
  neoforge-client:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Mesa and Xvfb
        run: sudo apt-get update || true; sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils libopenal1
      - name: Prepare run directory
        run: |
          mkdir -p backends/neoforge-1.21.1/run
          echo 12000 > backends/neoforge-1.21.1/run/overflight-autoshot
          echo "onboardAccessibility:false" > backends/neoforge-1.21.1/run/options.txt
      - name: Run client
        run: >-
          LIBGL_ALWAYS_SOFTWARE=1 timeout 1500
          xvfb-run -a -s "-screen 0 1280x720x24"
          ./gradlew :backends:neoforge-1.21.1:runClient --no-daemon -PwithNeoForge
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64
          | tee client.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neoforge-client
          path: |
            client.log
            backends/neoforge-1.21.1/run/screenshots/
            backends/neoforge-1.21.1/run/logs/latest.log

  # Dedicated server with the mod: it has to start without client classes, register /airspace
  # and run a manual flight. Manual only: it downloads Minecraft.
  forge-server:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Prepare server directory
        run: |
          mkdir -p backends/forge-1.20.1/run-server
          echo "eula=true" > backends/forge-1.20.1/run-server/eula.txt
      - name: Run server
        run: |
          (sleep 420; echo "airspace spawn"; sleep 5; echo "airspace clear"; sleep 3; echo stop) |
          timeout 900 gradle :backends:forge-1.20.1:runServer --no-daemon -PwithForge \
            -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64 | tee server.log
          grep -q "Done (" server.log
          ! grep -E "NoClassDefFoundError|ClassNotFoundException|Mixin apply failed" server.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-server
          path: |
            server.log
            backends/forge-1.20.1/run-server/logs/latest.log

  # Dedicated server with the mod: it has to start without client classes, register /airspace
  # and run a manual flight. Manual only: it downloads Minecraft.
  neoforge-server:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare server directory
        run: |
          mkdir -p backends/neoforge-1.21.1/run-server
          echo "eula=true" > backends/neoforge-1.21.1/run-server/eula.txt
      - name: Run server
        run: |
          (sleep 420; echo "airspace spawn"; sleep 5; echo "airspace clear"; sleep 3; echo stop) |
          timeout 900 ./gradlew :backends:neoforge-1.21.1:runServer --no-daemon -PwithNeoForge \
            -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64 | tee server.log
          grep -q "Done (" server.log
          ! grep -E "NoClassDefFoundError|ClassNotFoundException|Mixin apply failed" server.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neoforge-server
          path: |
            server.log
            backends/neoforge-1.21.1/run-server/logs/latest.log
