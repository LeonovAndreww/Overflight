plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base.archivesName = 'overflight-fabric-' + minecraft_version_261
group = rootProject.group
version = rootProject.version

// 26.1 and 26.2 are the same generation of the render pipeline, so this backend
// builds from the 26.2 sources. The files listed below are the ones the two
// versions genuinely differ over; this backend brings its own copy of each and
// takes the rest verbatim.
//
// Copied through a directory rather than added as a second source root, because
// javac has no notion of one source root shadowing another: pointing it at both
// would simply compile each class twice and fail.
def sharedBackendSources = tasks.register('sharedBackendSources', Sync) {
	from project(':backends:fabric-26.2').file('src/main/java')
	exclude 'dev/overflight/fabric/SkyPipeline.java'
	into layout.buildDirectory.dir('shared-backend-sources')
}

sourceSets.main.java.srcDir project(':overflight-core').file('src/main/java')
sourceSets.main.java.srcDir sharedBackendSources
sourceSets.main.resources.srcDir project(':overflight-core').file('src/main/resources')
sourceSets.main.resources.srcDir rootProject.file('common/resources')

repositories {
	maven { name = 'Cloth Config'; url = 'https://maven.shedaniel.me/' }
	maven { name = 'Mod Menu'; url = 'https://maven.terraformersmc.com/releases/' }
}

loom {
	mods {
		"overflight" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version_261}"
	implementation "net.fabricmc:fabric-loader:${loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version_261}"

	implementation("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version_261}") {
		exclude(group: 'net.fabricmc.fabric-api')
	}
	compileOnly "com.terraformersmc:modmenu:${mod_menu_version_261}"
}

processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') {
		expand 'version': project.version
	}
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}
