plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base.archivesName = 'overflight-fabric-' + minecraft_version_261
group = rootProject.group
version = rootProject.version

// 26.1 and 26.2 are the same generation of the render pipeline, so this backend
// compiles the 26.2 sources rather than copying them. Where the two versions
// genuinely differ, a file of the same name placed under this project's own
// source directory wins.
sourceSets.main.java.srcDir project(':overflight-core').file('src/main/java')
sourceSets.main.java.srcDir project(':backends:fabric-26.2').file('src/main/java')
sourceSets.main.resources.srcDir project(':overflight-core').file('src/main/resources')
sourceSets.main.resources.srcDir rootProject.file('common/resources')

repositories {
	maven { name = 'Cloth Config'; url = 'https://maven.shedaniel.me/' }
	maven { name = 'Mod Menu'; url = 'https://maven.terraformersmc.com/releases/' }
}

loom {
	mods {
		"overflight" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version_261}"
	implementation "net.fabricmc:fabric-loader:${loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version_261}"

	implementation("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version_261}") {
		exclude(group: 'net.fabricmc.fabric-api')
	}
	compileOnly "com.terraformersmc:modmenu:${mod_menu_version_261}"
}

processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') {
		expand 'version': project.version
	}
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}
