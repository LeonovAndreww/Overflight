plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base.archivesName = 'overflight-fabric-' + minecraft_version_263
group = rootProject.group
version = rootProject.version

// 26.3 builds from the 26.2 sources. A file the two versions come to differ
// over gets its own copy here and an exclude below.
//
// Copied through a directory rather than added as a second source root, because
// javac has no notion of one source root shadowing another: pointing it at both
// would simply compile each class twice and fail.
def sharedBackendSources = tasks.register('sharedBackendSources', Sync) {
	from project(':backends:fabric-26.2').file('src/main/java')
	// The pipeline classes moved to com.mojang.renderpearl in 26.3.
	exclude 'dev/overflight/fabric/SkyPipeline.java'
	into layout.buildDirectory.dir('shared-backend-sources')
}

sourceSets.main.java.srcDir project(':overflight-core').file('src/main/java')
sourceSets.main.java.srcDir sharedBackendSources
sourceSets.main.resources.srcDir project(':overflight-core').file('src/main/resources')
// The shared resources, less the contrail shaders: 26.3 compiles each shader
// stage on its own, which needs a differently written copy, kept in this
// backend's resources.
def sharedResources = tasks.register('sharedResources', Sync) {
	from rootProject.file('common/resources')
	exclude 'assets/overflight/shaders/core/contrail.*'
	into layout.buildDirectory.dir('shared-resources')
}
sourceSets.main.resources.srcDir sharedResources

repositories {
	maven { name = 'Cloth Config'; url = 'https://maven.shedaniel.me/' }
	maven { name = 'Mod Menu'; url = 'https://maven.terraformersmc.com/releases/' }
}

loom {
	mods {
		"overflight" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version_263}"
	implementation "net.fabricmc:fabric-loader:${loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version_263}"

	implementation("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version_263}") {
		exclude(group: 'net.fabricmc.fabric-api')
	}
	compileOnly "com.terraformersmc:modmenu:${mod_menu_version_263}"
}

processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') {
		expand 'version': project.version
	}
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}
