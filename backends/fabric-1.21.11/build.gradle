plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base.archivesName = 'overflight-fabric-' + minecraft_version_12111
group = rootProject.group
version = rootProject.version

// 1.21.6 onwards is the same generation of the render pipeline as 26.x, so this
// starts from the 26.2 sources. Mojang renamed a number of classes between the
// two, and anything that differs is overridden by a file of the same name in
// this project's own source directory, which takes precedence.
sourceSets.main.java.srcDir project(':overflight-core').file('src/main/java')
sourceSets.main.java.srcDir project(':backends:fabric-26.2').file('src/main/java')
sourceSets.main.resources.srcDir project(':overflight-core').file('src/main/resources')
sourceSets.main.resources.srcDir rootProject.file('common/resources')

repositories {
	maven { name = 'Cloth Config'; url = 'https://maven.shedaniel.me/' }
	maven { name = 'Mod Menu'; url = 'https://maven.terraformersmc.com/releases/' }
}

loom {
	mods {
		"overflight" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version_12111}"
	modImplementation "net.fabricmc:fabric-loader:${loader_version_12111}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version_12111}"

	modImplementation("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version_12111}") {
		exclude(group: 'net.fabricmc.fabric-api')
	}
	modCompileOnly "com.terraformersmc:modmenu:${mod_menu_version_12111}"

}

processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') {
		expand 'version': project.version
	}
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}
