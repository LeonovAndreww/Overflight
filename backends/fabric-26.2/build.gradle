plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base.archivesName = 'overflight-fabric-' + minecraft_version
group = rootProject.group
version = rootProject.version

// Compile the shared core straight into this backend rather than bundling a
// jar. Every backend does the same, at its own language level, which is what
// keeps a single set of physics sources usable from 1.7.10 to 26.2.
sourceSets.main.java.srcDir project(':overflight-core').file('src/main/java')
sourceSets.main.resources.srcDir project(':overflight-core').file('src/main/resources')
sourceSets.main.resources.srcDir rootProject.file('common/resources')

loom {
	mods {
		"overflight" {
			sourceSet sourceSets.main
		}
	}
}

repositories {
	maven { name = 'Cloth Config'; url = 'https://maven.shedaniel.me/' }
	maven { name = 'Mod Menu'; url = 'https://maven.terraformersmc.com/releases/' }
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

	// Both optional at runtime: the settings screen exists if they are installed
	// and the mod is perfectly usable through its config file if they are not.
	implementation("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
		exclude(group: 'net.fabricmc.fabric-api')
	}
	compileOnly "com.terraformersmc:modmenu:${mod_menu_version}"
	// Dev runtime only, so the settings screen can actually be opened and
	// tested. It is never a dependency of the published jar.
	localRuntime "com.terraformersmc:modmenu:${mod_menu_version}"
}

processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') {
		expand 'version': project.version
	}
}

java {
	// Pinned rather than inherited from JAVA_HOME: Minecraft 26.2 requires Java 25,
	// and Gradle keeps its own older JDKs around that would otherwise be picked up.
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}
