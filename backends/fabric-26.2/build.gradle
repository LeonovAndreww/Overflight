plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base.archivesName = 'overflight-fabric-' + minecraft_version
group = rootProject.group
version = rootProject.version

// Compile the shared core straight into this backend rather than bundling a
// jar. Every backend does the same, at its own language level, which is what
// keeps a single set of physics sources usable from 1.7.10 to 26.2.
sourceSets.main.java.srcDir project(':overflight-core').file('src/main/java')
sourceSets.main.resources.srcDir project(':overflight-core').file('src/main/resources')

loom {
	mods {
		"overflight" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') {
		expand 'version': project.version
	}
}

java {
	// Pinned rather than inherited from JAVA_HOME: Minecraft 26.2 requires Java 25,
	// and Gradle keeps its own older JDKs around that would otherwise be picked up.
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}
