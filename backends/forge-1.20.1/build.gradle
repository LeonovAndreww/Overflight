plugins {
	id 'java'
	id 'net.minecraftforge.gradle' version "${forgegradle_version}"
	id 'org.spongepowered.mixin' version "${mixingradle_version}"
}

base.archivesName = 'overflight-forge-' + minecraft_version_1201
group = rootProject.group
version = rootProject.version

// Forge on the same game version as the Fabric 1.20.1 backend, with the same
// rendering sources: only the entry points, events, commands and networking differ.

sourceSets.main.java.srcDir project(':overflight-core').file('src/main/java')
sourceSets.main.resources.srcDir project(':overflight-core').file('src/main/resources')
// The shared resources, less the contrail vertex shader (1.20.1 has no
// sample_lightmap.glsl to import, so it keeps its own copy) and the mixin
// config, which names this backend's package.
def sharedResources = tasks.register('sharedResources', Sync) {
	from rootProject.file('common/resources')
	exclude 'assets/overflight/shaders/core/contrail.vsh'
	exclude 'overflight.mixins.json'
	into layout.buildDirectory.dir('shared-resources')
}
sourceSets.main.resources.srcDir sharedResources

repositories {
	maven { name = 'Cloth Config'; url = 'https://maven.shedaniel.me/' }
}

minecraft {
	mappings channel: 'official', version: minecraft_version_1201
	runs {
		client {
			workingDirectory project.file('run')
			property 'mixin.env.remapRefMap', 'true'
			property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
			mods {
				overflight {
					source sourceSets.main
				}
			}
		}
		server {
			workingDirectory project.file('run-server')
			property 'mixin.env.remapRefMap', 'true'
			property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
			args '--nogui'
			mods {
				overflight {
					source sourceSets.main
				}
			}
		}
	}
}

mixin {
	add sourceSets.main, 'overflight.refmap.json'
	config 'overflight.mixins.json'
}

dependencies {
	minecraft "net.minecraftforge:forge:${minecraft_version_1201}-${forge_version_1201}"
	annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
	compileOnly fg.deobf("me.shedaniel.cloth:cloth-config-forge:${cloth_config_version_1201}")
}

processResources {
	inputs.property 'version', project.version
	filesMatching('META-INF/mods.toml') {
		expand 'version': project.version
	}
}

jar {
	manifest {
		attributes 'MixinConfigs': 'overflight.mixins.json'
	}
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

tasks.named('jar') {
	finalizedBy 'reobfJar'
}

// Dev-only screenshot hook; OverflightClient loads it reflectively, so release
// jars simply do without it. runClient/runServer use the class directories.
tasks.named('jar') {
	exclude '**/DevAutoShot*.class'
}
