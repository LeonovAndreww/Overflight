// Version-agnostic simulation core: atmosphere, contrail physics, traffic.
//
// Compiled at Java 8 so the exact same sources can be pulled into backends for
// very old Minecraft versions. Backends do not depend on this jar -- they add
// src/main/java as an extra source directory and compile it at their own
// language level. This project exists so the physics can be built and tested
// on its own, without Minecraft anywhere in the picture.
plugins {
	id 'java'
}

group = rootProject.group
version = rootProject.version

repositories {
	mavenCentral()
}

dependencies {
	testImplementation platform('org.junit:junit-bom:5.11.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 8
	// The Java 8 target is obsolete under modern JDKs and says so, loudly.
	options.compilerArgs << '-Xlint:-options'
}

// The tests are the only thing here that never ships, so they are free to use a
// language the backends could not compile.
tasks.named('compileTestJava') {
	options.release = 21
}

tasks.named('test') {
	useJUnitPlatform()
	testLogging {
		events 'failed'
		exceptionFormat 'full'
	}
}
