pluginManagement {
	repositories {
		maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'overflight'

include 'overflight-core'
include 'backends:fabric-26.2'
include 'backends:fabric-26.1'
// The last obfuscated version, so it builds through Loom's remapping plugin
// rather than the plain one the 26.x backends use.
include 'backends:fabric-1.21.11'
